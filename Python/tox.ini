[tox]
requires =
    tox>=4
env_list =
    clean
#    copydata
    py{311,312,313}
    lint
    type
    docs
    report

[testenv]
description = run the tests with pytest
skip_install = true
allowlist_externals = poetry
depends =
    py{311,312,313}: clean
commands_pre = 
    poetry install
commands =
    poetry run pytest -v -s --cov --cov-append --cov-report=term-missing {posargs:tests}

[testenv:clean]
description = cleans previous coverge reports
skip_install = true
allowlist_externals =
    poetry
commands_pre =
    poetry install
commands =
    coverage erase

[testenv:report]
description = prints out code coverage report
depends = py{311,312,313}
skip_install = true
commands_pre = 
    poetry install
commands =
    coverage report
    coverage html

