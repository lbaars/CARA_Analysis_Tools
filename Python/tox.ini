[testenv:lint]
description = run linter
skip_install = true
allowlist_externals = poetry
commands_pre = 
    poetry install
commands =
    poetry run ruff check {posargs:src tests}

[testenv:type]
description = run type checks
skip_install = true
allowlist_externals = poetry
commands_pre =
    poetry install
commands = poetry run mypy {posargs:src tests}

[testenv:docs]
description = auto generate output documents
depends = clean
skip_install = true
allowlist_externals =
    rm
    poetry
    bash
    rmdir
commands_pre =
    poetry install
commands =
    rm -rf docs
    poetry run pdoc --html --output-dir docs cara_analysis_tools
    bash -c 'mv docs/cara_analysis_tools/* docs'
    rmdir docs/cara_analysis_tools