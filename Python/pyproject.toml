[project]
name = "python"
version = "0.2.0"
description = ""
authors = [
    {name = "Luis Baars",email = "luis.baars@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11.0,<4.0"
dependencies = [
    "numpy (>=2.3.1,<3.0.0)",
    "scipy (>=1.16.0,<2.0.0)",
    "scipy-stubs (>=1.16.0.2,<2.0.0.0)"
]

[tool.poetry]
name = "cara_analysis_tools"
version = "0.2.0"
description = "Python port of NASA's cara_analysis_tools Matlab code"
packages = [{include = "cara_analysis_tools", from = "src"}]


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-cov = "^6.2.1"
pytest-sugar = "^1.0.0"
mypy = "^1.16.0"
ruff = "^0.11.13"
pdoc3 = "^0.11.6"
debugpy = "^1.8.14"
pudb = "^2025.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
